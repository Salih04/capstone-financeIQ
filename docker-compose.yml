services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./2.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/capstone_db
      SECRET_KEY: CHANGE_ME_IN_PRODUCTION_supersecretkey123
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # Trusted yearly dataset paths (loaded on startup, see backend Dockerfile CMD).
      # In the container /app == 2.backend, so paths are explicit.
      TRUSTED_DATASETS_DIR: /app/3.Datasets
      TRUSTED_OUT_DIR: /app/data/trusted
      TRUSTED_COMBINED_CSV: /app/data/trusted/stocks_2020_2025.csv
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - ./2.backend:/app
    - ./3.Datasets:/app/3.Datasets
    # Research-agent reads these generated artifacts (research_agent paths
    # resolve to /app when data is mounted here).
    - ./data:/app/data
    - ./experiments:/app/experiments

  frontend:
    build: ./1.frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
