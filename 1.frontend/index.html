<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceIQ – Financial Analysis Platform</title>
    <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep:      #030712;
        --bg:           #07111F;
        --surface-1:    rgba(12, 22, 36, 0.92);
        --surface-2:    rgba(17, 30, 48, 0.82);
        --surface-3:    rgba(28, 45, 68, 0.78);
        --surface-hover:rgba(38, 60, 88, 0.82);

        --border:        rgba(148, 163, 184, 0.13);
        --border-strong: rgba(148, 163, 184, 0.22);
        --border-bright: rgba(125, 211, 252, 0.38);

        --primary:        #F5B14C;
        --primary-hover:  #FFD37A;
        --primary-muted:  rgba(245,177,76,0.18);
        --primary-glow:   rgba(245,177,76,0.26);
        --primary-subtle: rgba(245,177,76,0.10);

        --secondary:        #39E6D0;
        --secondary-hover:  #7AF7EA;
        --secondary-subtle: rgba(57,230,208,0.12);
        --violet:           #8B5CF6;
        --violet-subtle:    rgba(139,92,246,0.13);

        --success:        #3AC78B;
        --success-light:  #58D7A2;
        --success-muted:  rgba(58,199,139,0.18);
        --success-subtle: rgba(58,199,139,0.09);

        --warning:        #F2A95B;
        --warning-light:  #F7BB78;
        --warning-muted:  rgba(242,169,91,0.18);
        --warning-subtle: rgba(242,169,91,0.09);

        --danger:         #E97056;
        --danger-light:   #F28C75;
        --danger-muted:   rgba(233,112,86,0.18);
        --danger-subtle:  rgba(233,112,86,0.09);

        --info:           #55C2C3;
        --info-subtle:    rgba(85,194,195,0.12);

        --text-1: #F8FBFF;
        --text-2: #C9D7EE;
        --text-3: #8FA3C2;
        --text-4: #4B5C77;

        --font:      'Manrope', -apple-system, system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

        --radius-sm:  5px;
        --radius-md:  12px;
        --radius-lg:  18px;
        --radius-xl:  26px;
        --radius-2xl: 28px;

        --shadow-sm:   0 10px 30px rgba(0,0,0,0.20);
        --shadow-md:   0 18px 55px rgba(0,0,0,0.30);
        --shadow-lg:   0 28px 90px rgba(0,0,0,0.42);
        --shadow-glow: 0 0 34px rgba(57,230,208,0.16), 0 0 38px rgba(245,177,76,0.12);

        --sidebar-w:    244px;
        --sidebar-coll: 68px;
        --topbar-h:     58px;
      }

      [data-theme="light"] {
        --bg-deep:      #F1F4F8;
        --bg:           #F8FAFC;
        --surface-1:    #FFFFFF;
        --surface-2:    #F2F5F9;
        --surface-3:    #E6ECF3;
        --surface-hover:#EEF3F8;

        --border:        #C7D2E0;
        --border-strong: #B6C3D4;
        --border-bright: #97A8BE;

        --primary:        #C98217;
        --primary-hover:  #B57413;
        --primary-muted:  rgba(201,130,23,0.12);
        --primary-glow:   rgba(201,130,23,0.12);
        --primary-subtle: rgba(201,130,23,0.06);

        --secondary:        #2B8C8D;
        --secondary-hover:  #247577;
        --secondary-subtle: rgba(43,140,141,0.08);

        --success:        #1F9C66;
        --success-light:  #2DB47A;
        --success-muted:  rgba(31,156,102,0.12);
        --success-subtle: rgba(31,156,102,0.07);

        --warning:        #D28B3B;
        --warning-light:  #E9A35E;
        --warning-muted:  rgba(210,139,59,0.12);
        --warning-subtle: rgba(210,139,59,0.07);

        --danger:         #D34B3A;
        --danger-light:   #E56A5A;
        --danger-muted:   rgba(211,75,58,0.12);
        --danger-subtle:  rgba(211,75,58,0.07);

        --info:           #2B8C8D;
        --info-subtle:    rgba(43,140,141,0.1);

        --text-1: #09090F;
        --text-2: #374151;
        --text-3: #6B7280;
        --text-4: #9CA3AF;

        --shadow-sm:   0 1px 4px rgba(0,0,0,0.08);
        --shadow-md:   0 4px 20px rgba(0,0,0,0.10);
        --shadow-lg:   0 8px 40px rgba(0,0,0,0.14);
        --shadow-glow: 0 0 28px rgba(201,130,23,0.14);
      }

      html, body, #root { height: 100%; }

      body {
        font-family: var(--font);
        background: radial-gradient(circle at 14% 8%, rgba(245,177,76,0.13), transparent 34%),
                    radial-gradient(circle at 88% 5%, rgba(57,230,208,0.12), transparent 32%),
                    linear-gradient(180deg, #030712 0%, #07111F 45%, #050B16 100%),
                    var(--bg);
        color: var(--text-1);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        min-height: 100vh;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
      *::-webkit-scrollbar { width: 5px; height: 5px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

      input, button, select, textarea { font-family: var(--font); }

      button { cursor: pointer; }

      a { text-decoration: none; color: inherit; }

      .glass-panel {
        background: linear-gradient(180deg, rgba(17,30,48,0.82), rgba(10,18,30,0.72));
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(18px);
      }

      .premium-hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 28px;
        background:
          linear-gradient(135deg, rgba(245,177,76,0.16), rgba(57,230,208,0.09) 42%, rgba(17,30,48,0.88)),
          radial-gradient(circle at 88% 12%, rgba(139,92,246,0.18), transparent 34%);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(18px);
      }

      .premium-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.08), transparent 28%),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 72px);
        opacity: .55;
      }

      .premium-card-hover {
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }

      .premium-card-hover:hover {
        transform: translateY(-3px);
        border-color: var(--border-bright) !important;
        box-shadow: var(--shadow-glow);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
