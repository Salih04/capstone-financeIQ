    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep:      #080b0a;
        --bg:           #0a0e0d;
        --surface-1:    rgba(14, 20, 19, 0.92);
        --surface-2:    rgba(18, 26, 24, 0.85);
        --surface-3:    rgba(26, 36, 33, 0.80);
        --surface-hover:rgba(33, 45, 41, 0.85);

        --border:        rgba(200, 211, 202, 0.13);
        --border-strong: rgba(200, 211, 202, 0.22);
        --border-bright: rgba(200, 163, 90, 0.45);

        --primary:        #C8A35A;
        --primary-hover:  #DCBB74;
        --primary-muted:  rgba(200,163,90,0.18);
        --primary-glow:   rgba(200,163,90,0.26);
        --primary-subtle: rgba(200,163,90,0.10);

        --secondary:        #4DA583;
        --secondary-hover:  #6DBD9D;
        --secondary-subtle: rgba(77,165,131,0.12);
        --violet:           #A8674B;
        --violet-subtle:    rgba(168,103,75,0.13);

        --success:        #4DA583;
        --success-light:  #6DBD9D;
        --success-muted:  rgba(77,165,131,0.18);
        --success-subtle: rgba(77,165,131,0.09);

        --warning:        #C8A35A;
        --warning-light:  #DCBB74;
        --warning-muted:  rgba(200,163,90,0.18);
        --warning-subtle: rgba(200,163,90,0.09);

        --danger:         #B95F44;
        --danger-light:   #D08164;
        --danger-muted:   rgba(185,95,68,0.18);
        --danger-subtle:  rgba(185,95,68,0.09);

        --info:           #5A9A8C;
        --info-subtle:    rgba(90,154,140,0.12);

        --text-1: #E8ECE6;
        --text-2: #B7C2B8;
        --text-3: #8A988C;
        --text-4: #5D6B62;

        --font:      'Manrope', -apple-system, system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

        --radius-sm:  3px;
        --radius-md:  6px;
        --radius-lg:  10px;
        --radius-xl:  14px;
        --radius-2xl: 16px;

        --shadow-sm:   0 10px 30px rgba(0,0,0,0.25);
        --shadow-md:   0 18px 55px rgba(0,0,0,0.35);
        --shadow-lg:   0 28px 90px rgba(0,0,0,0.48);
        --shadow-glow: 0 0 34px rgba(77,165,131,0.14), 0 0 38px rgba(200,163,90,0.10);

        --sidebar-w:    244px;
        --sidebar-coll: 68px;
        --topbar-h:     58px;
      }

      [data-theme="light"] {
        --bg-deep:      #F1F4F8;
        --bg:           #F8FAFC;
        --surface-1:    #FFFFFF;
        --surface-2:    #F2F5F9;
        --surface-3:    #E6ECF3;
        --surface-hover:#EEF3F8;

        --border:        #C7D2E0;
        --border-strong: #B6C3D4;
        --border-bright: #97A8BE;

        --primary:        #C98217;
        --primary-hover:  #B57413;
        --primary-muted:  rgba(201,130,23,0.12);
        --primary-glow:   rgba(201,130,23,0.12);
        --primary-subtle: rgba(201,130,23,0.06);

        --secondary:        #2B8C8D;
        --secondary-hover:  #247577;
        --secondary-subtle: rgba(43,140,141,0.08);

        --success:        #1F9C66;
        --success-light:  #2DB47A;
        --success-muted:  rgba(31,156,102,0.12);
        --success-subtle: rgba(31,156,102,0.07);

        --warning:        #D28B3B;
        --warning-light:  #E9A35E;
        --warning-muted:  rgba(210,139,59,0.12);
        --warning-subtle: rgba(210,139,59,0.07);

        --danger:         #D34B3A;
        --danger-light:   #E56A5A;
        --danger-muted:   rgba(211,75,58,0.12);
        --danger-subtle:  rgba(211,75,58,0.07);

        --info:           #2B8C8D;
        --info-subtle:    rgba(43,140,141,0.1);

        --text-1: #09090F;
        --text-2: #374151;
        --text-3: #6B7280;
        --text-4: #9CA3AF;

        --shadow-sm:   0 1px 4px rgba(0,0,0,0.08);
        --shadow-md:   0 4px 20px rgba(0,0,0,0.10);
        --shadow-lg:   0 8px 40px rgba(0,0,0,0.14);
        --shadow-glow: 0 0 28px rgba(201,130,23,0.14);
      }

      html, body, #root { height: 100%; }

      body {
        font-family: var(--font);
        background: radial-gradient(1100px 540px at 78% -8%, rgba(77,165,131,0.07), transparent 60%),
                    radial-gradient(800px 500px at 8% 108%, rgba(168,103,75,0.06), transparent 60%),
                    linear-gradient(165deg, #0b100f 0%, #0a0e0d 55%, #080b0a 100%),
                    var(--bg);
        color: var(--text-1);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        min-height: 100vh;
      }

      [data-theme="dark"] body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 4px);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
      *::-webkit-scrollbar { width: 5px; height: 5px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

      input, button, select, textarea { font-family: var(--font); }

      button { cursor: pointer; }

      a { text-decoration: none; color: inherit; }

      .glass-panel {
        background: linear-gradient(180deg, rgba(18,26,24,0.85), rgba(11,16,15,0.75));
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(18px);
      }

      .premium-hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        background:
          linear-gradient(135deg, rgba(200,163,90,0.14), rgba(77,165,131,0.08) 42%, rgba(18,26,24,0.88)),
          radial-gradient(circle at 88% 12%, rgba(168,103,75,0.16), transparent 34%);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(18px);
      }

      .premium-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.08), transparent 28%),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 72px);
        opacity: .55;
      }

      .premium-card-hover {
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }

      .premium-card-hover:hover {
        transform: translateY(-3px);
        border-color: var(--border-bright) !important;
        box-shadow: var(--shadow-glow);
      }
    </style>
