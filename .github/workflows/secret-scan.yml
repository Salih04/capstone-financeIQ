name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (tree + new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checked-out tree must be clean regardless of history.
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner

      # Only commits introduced by this PR / push are scanned. Full history is
      # deliberately not gated: it contains one known, revoked credential
      # (see SECURITY.md) and rewriting history would invalidate the commit
      # SHAs that the preregistration records pin.
      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD_SHA"
          else
            RANGE="$BASE..$HEAD_SHA"
          fi
          git config --global --add safe.directory /repo
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --log-opts="$RANGE"
