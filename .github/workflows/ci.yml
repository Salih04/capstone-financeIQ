name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Backend compile checks
        run: |
          python -m compileall backend/app backend/scripts backend/alembic

      - name: Migration dry run
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          SECRET_KEY: ci-secret
        run: |
          cd backend
          alembic upgrade head

      - name: API contract tests
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci_contract.db
          SECRET_KEY: ci-secret
        run: |
          cd backend
          python -m unittest tests/test_forecasting_api_contract.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build
